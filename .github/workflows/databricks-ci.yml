name: Databricks Asset Bundles CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: databricks-dev
  cancel-in-progress: false

env:
  # Azure FEVM workspace currently hosting this demo (see src/app/app.yaml).
  DATABRICKS_HOST: https://adb-7405612117836809.9.azuredatabricks.net
  DATABRICKS_TOKEN: ${{ secrets.DEPLOY_NOTEBOOK_TOKEN }}
  # Known serverless warehouse bound to the deployed app.
  WAREHOUSE_ID: e921c86338f3e272

jobs:
  validate-and-test:
    # Switch to `runs-on: html_publisher` once this repo is moved into the
    # databricks-industry-solutions GitHub org and the self-hosted runner is
    # available. Until then, use the public ubuntu runner.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/app/client/package-lock.json

      # Install and build before making any deployment credential available.
      # npm lifecycle scripts must not be able to read the Databricks token.
      #
      # The public registry is pinned here because lockfiles regenerated on the
      # Databricks network resolve to an internal proxy the runner cannot reach.
      # npm can also die without setting an exit code, so the install is bounded
      # by a timeout and node_modules is verified before the build runs.
      - name: Build React SPA
        working-directory: src/app/client
        env:
          # Keep Databricks credentials out of this step's environment.
          DATABRICKS_HOST: ''
          DATABRICKS_TOKEN: ''
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_FETCH_TIMEOUT: '120000'
          NPM_CONFIG_FETCH_RETRIES: '2'
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            timeout 10m npm ci --no-audit --no-fund
          else
            timeout 10m npm install --no-audit --no-fund
          fi
          if [ ! -d node_modules/react ]; then
            echo "::error::npm install did not produce node_modules; aborting before build"
            exit 1
          fi
          npm run build

      - name: Require Databricks token
        run: |
          if [ -z "${DATABRICKS_TOKEN}" ]; then
            echo "::error::DEPLOY_NOTEBOOK_TOKEN secret is not set on this repository"
            exit 1
          fi

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: >
          databricks bundle validate --target dev
          --var=warehouse_id=${WAREHOUSE_ID}
          --var=catalog=classic_stable_2cn624
          --var=schema=montreal
          --var=genie_space_id=01f153a756791677b216b0ad29cafef1

      - name: Deploy bundle
        run: >
          databricks bundle deploy --target dev
          --var=warehouse_id=${WAREHOUSE_ID}
          --var=catalog=classic_stable_2cn624
          --var=schema=montreal
          --var=genie_space_id=01f153a756791677b216b0ad29cafef1

      - name: Run flood pipeline
        run: >
          databricks bundle run flood_pipeline --target dev
          --var=warehouse_id=${WAREHOUSE_ID}
          --var=catalog=classic_stable_2cn624
          --var=schema=montreal
          --var=genie_space_id=01f153a756791677b216b0ad29cafef1

      - name: Cleanup PR deployment
        if: success() && github.event_name == 'pull_request'
        run: >
          databricks bundle destroy --target dev --auto-approve
          --var=warehouse_id=${WAREHOUSE_ID}
          --var=catalog=classic_stable_2cn624
          --var=schema=montreal
          --var=genie_space_id=01f153a756791677b216b0ad29cafef1
          || true
