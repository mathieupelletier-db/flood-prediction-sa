command:
  - "uvicorn"
  - "main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DATABRICKS_CATALOG
    value: "classic_stable_2cn624"
  # Schema must match the bundle deploy. With DAB's `mode: development` and the
  # default var.schema=montreal, the deployed schema name is prefixed to
  # `dev_<user>_montreal`. If you override `--var=schema=<name>` at deploy time,
  # update this to `dev_<user>_<name>` (or whatever the deploy target produces).
  - name: DATABRICKS_SCHEMA
    value: "dev_mathieu_pelletier_montreal"
  - name: DEFAULT_AOI
    value: "greater_montreal"
  - name: MAX_CELLS_PER_REQUEST
    value: "50000"
  # Wire the SQL warehouse binding from resources/app.yml into env vars the
  # databricks-sql-connector understands. The service principal token is
  # injected automatically by Databricks Apps via DATABRICKS_CLIENT_ID/SECRET.
  - name: DATABRICKS_HOST
    value: "adb-7405612117836809.9.azuredatabricks.net"
  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/e921c86338f3e272"
